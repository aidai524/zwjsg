name: zwjsg_app
description: 再玩我是狗 · 手机使用越多越像狗
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  go_router: ^14.2.0
  dio: ^5.4.0
  pop_ui:
    path: ../../packages/pop_ui
  avatar_engine:
    path: ../../packages/avatar_engine
  series_core:
    path: ../../packages/series_core
  # 结算卡的截图、存相册、系统分享和 AI 标识，和天气 App 共用
  series_share:
    path: ../../packages/series_share
  shared_preferences: ^2.2.0
  path_provider: ^2.1.6
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    # 结算卡右下角的 App 图标（开源许可页的头上也用）
    - assets/icon/icon_full.png
    # 开源许可页：打包进 App 的模型、运行库的许可证全文（lib/core/licenses.dart）
    - assets/licenses/
    # 超时来电：原创铃声（iOS 的来电通知和来电界面）、接通音、挂断音（两边都用）
    - assets/sounds/
    # 超时来电：狗版的你的三种声音（AI 合成，tools/voice/make_voice.py 生成；目录名 = CallVoice 的名字）
    - assets/voice/spirit/
    - assets/voice/boy/
    - assets/voice/girl/

# 应用图标：改了 assets/icon 下的图片后，运行 `dart run flutter_launcher_icons` 重新生成两端图标
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon_full.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "#FFD23F"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  adaptive_icon_monochrome: "assets/icon/icon_monochrome.png"
