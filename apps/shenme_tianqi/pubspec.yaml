name: shenme_tianqi
description: 什么鬼天气 · 准的天气 + 嘴贫的形象 + 关心群
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  go_router: ^14.2.0
  dio: ^5.4.0
  shared_preferences: ^2.2.0
  pop_ui:
    path: ../../packages/pop_ui
  avatar_engine:
    path: ../../packages/avatar_engine
  series_core:
    path: ../../packages/series_core
  # 天气卡的截图、存相册、系统分享和 AI 标识，和狗 App 共用
  series_share:
    path: ../../packages/series_share
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    # 天气卡右下角的 App 图标
    - assets/icon/icon_full.png

# 应用图标：SVG 源文件在 assets/icon，改了之后重新导出同名 PNG，再运行 `dart run flutter_launcher_icons` 生成两端图标
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon_full.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "#FFD23F"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  adaptive_icon_monochrome: "assets/icon/icon_monochrome.png"
